<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibraryFlow · Modern Library Management</title>
    <style>
        /* Import Inter font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        /* Modern CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1e293b;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --radius-sm: 0.375rem;
            --radius: 0.5rem;
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--gray-800);
            line-height: 1.5;
        }

        .app-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* Glassmorphism Header */
        .glass-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            font-size: 2.5rem;
            line-height: 1;
        }

        .logo-text h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
        }

        .logo-text p {
            color: var(--gray-500);
            font-size: 0.9rem;
        }

        .stats-container {
            display: flex;
            gap: 2rem;
        }

        .stat-card {
            text-align: center;
            min-width: 100px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .auth-section {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--gray-300);
            color: var(--gray-700);
        }

        .btn-outline:hover {
            background: var(--gray-50);
            border-color: var(--gray-400);
        }

        .btn-success {
            background: var(--secondary);
            color: white;
        }

        .btn-success:hover {
            background: #0ca678;
        }

        /* Main Content */
        .main-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Search Section */
        .search-section {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .search-wrapper {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
        }

        .search-input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 1rem;
            transition: all 0.2s;
            background: white;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .action-buttons {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        /* Books Grid */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .book-card {
            background: white;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            border: 1px solid var(--gray-100);
            display: flex;
            flex-direction: column;
        }

        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--gray-200);
        }

        .book-cover {
            height: 180px;
            background: linear-gradient(135deg, var(--gray-100), var(--gray-200));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .book-cover::after {
            content: '📖';
            font-size: 4rem;
            opacity: 0.5;
        }

        .book-cover.has-image::after {
            display: none;
        }

        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .book-content {
            padding: 1.5rem;
            flex: 1;
        }

        .book-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .book-author {
            color: var(--gray-500);
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .book-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .badge {
            background: var(--gray-100);
            color: var(--gray-600);
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .badge-primary {
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary);
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--secondary);
        }

        .book-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--gray-100);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gray-500);
            font-size: 0.85rem;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--gray-500);
            transition: color 0.2s;
            padding: 0.25rem;
            border-radius: var(--radius-sm);
        }

        .icon-btn:hover {
            color: var(--primary);
            background: var(--gray-100);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: var(--radius-lg);
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--gray-800);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray-400);
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--gray-600);
        }

        .modal-body {
            padding: 1.5rem;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--gray-700);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .file-upload {
            border: 2px dashed var(--gray-200);
            border-radius: var(--radius);
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-upload:hover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.05);
        }

        .file-upload input {
            display: none;
        }

        .file-upload-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            color: var(--gray-500);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--gray-400);
        }

        .empty-state-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--gray-600);
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            margin-bottom: 2rem;
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(
                90deg,
                var(--gray-200) 25%,
                var(--gray-100) 50%,
                var(--gray-200) 75%
            );
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: var(--radius-sm);
        }

        @keyframes loading {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1100;
        }

        .toast {
            background: white;
            border-radius: var(--radius);
            padding: 1rem 1.5rem;
            margin-top: 0.5rem;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: toastSlideIn 0.3s ease;
            border-left: 4px solid var(--primary);
        }

        .toast.success {
            border-left-color: var(--secondary);
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        @keyframes toastSlideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .app-wrapper {
                padding: 1rem;
            }

            .header-content {
                flex-direction: column;
                align-items: stretch;
            }

            .stats-container {
                justify-content: space-around;
            }

            .auth-section {
                justify-content: center;
            }

            .books-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <!-- Header -->
        <header class="glass-header">
            <div class="header-content">
                <div class="logo-area">
                    <span class="logo-icon">📚</span>
                    <div class="logo-text">
                        <h1>LibraryFlow</h1>
                        <p>Modern Library Management</p>
                    </div>
                </div>

                <div class="stats-container">
                    <div class="stat-card">
                        <div class="stat-value" id="totalBooks">0</div>
                        <div class="stat-label">Total Books</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="availableBooks">0</div>
                        <div class="stat-label">Available</div>
                    </div>
                </div>

                <div class="auth-section">
                    <button class="btn btn-outline" onclick="showLoginModal()">Sign in</button>
                    <button class="btn btn-primary" onclick="showRegisterModal()">Sign up</button>
                    <button class="btn btn-outline" style="display: none;" id="signOutBtn">Sign out</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Search and Actions -->
            <div class="search-section">
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" placeholder="Search by title, author, ISBN or category..." id="searchInput">
                </div>
                <div class="action-buttons">
                    <button class="btn btn-outline" onclick="resetSearch()">
                        <span>🔄</span> Reset
                    </button>
                    <button class="btn btn-primary" onclick="showAddBookModal()">
                        <span>+</span> Add New Book
                    </button>
                </div>
            </div>

            <!-- Books Grid -->
            <div id="booksContainer">
                <div class="books-grid" id="booksGrid">
                    <!-- Books will be dynamically inserted here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Add Book Modal -->
    <div class="modal" id="addBookModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Book</h2>
                <button class="close-btn" onclick="closeModal('addBookModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addBookForm" onsubmit="addBook(event)">
                    <div class="form-group">
                        <label class="form-label" for="title">Title *</label>
                        <input type="text" class="form-control" id="title" name="Title" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="author">Author *</label>
                        <input type="text" class="form-control" id="author" name="Author" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="publisher">Publisher *</label>
                        <input type="text" class="form-control" id="publisher" name="Publisher" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="isbn">ISBN *</label>
                            <input type="text" class="form-control" id="isbn" name="ISBN" required pattern="[0-9]{10,13}">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="category">Category</label>
                            <input type="text" class="form-control" id="category" name="Category">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="pageCount">Page Count</label>
                            <input type="number" class="form-control" id="pageCount" name="PageCount" min="1">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="publicationYear">Published Year</label>
                            <input type="number" class="form-control" id="publicationYear" name="PublicationYear" min="1000" max="2100">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="quantity">Quantity *</label>
                            <input type="number" class="form-control" id="quantity" name="Quantity" required min="1" value="1">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="bookFile">Book File (PDF/EPUB)</label>
                        <div class="file-upload" onclick="document.getElementById('bookFile').click()">
                            <input type="file" id="bookFile" name="BookFile" accept=".pdf,.epub,.mobi" onchange="updateFileName(this)">
                            <div class="file-upload-label">
                                <span>📎</span>
                                <span>Click to upload or drag and drop</span>
                                <span style="font-size: 0.85rem;">PDF, EPUB up to 10MB</span>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                        <button type="button" class="btn btn-outline" onclick="closeModal('addBookModal')">Cancel</button>
                        <button type="submit" class="btn btn-primary">Add Book</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Welcome Back</h2>
                <button class="close-btn" onclick="closeModal('loginModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form onsubmit="login(event)">
                    <div class="form-group">
                        <label class="form-label" for="loginUsername">Username or Email</label>
                        <input type="text" class="form-control" id="loginUsername" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="loginPassword">Password</label>
                        <input type="password" class="form-control" id="loginPassword" required>
                    </div>
                    <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                        <button type="button" class="btn btn-outline" onclick="closeModal('loginModal')">Cancel</button>
                        <button type="submit" class="btn btn-primary">Sign in</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Register Modal -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create Account</h2>
                <button class="close-btn" onclick="closeModal('registerModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form onsubmit="register(event)">
                    <div class="form-group">
                        <label class="form-label" for="regUsername">Username</label>
                        <input type="text" class="form-control" id="regUsername" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="regFirstName">First name</label>
                            <input type="text" class="form-control" id="regFirstName" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="regLastName">Last name</label>
                            <input type="text" class="form-control" id="regLastName" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="regEmail">Email</label>
                        <input type="email" class="form-control" id="regEmail" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="regPassword">Password</label>
                        <input type="password" class="form-control" id="regPassword" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="regConfirmPassword">Confirm Password</label>
                        <input type="password" class="form-control" id="regConfirmPassword" required>
                    </div>
                    <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                        <button type="button" class="btn btn-outline" onclick="closeModal('registerModal')">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create account</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div class="modal" id="profileModal">
        <div class="modal-content" style="max-width:900px;">
            <div class="modal-header">
                <h2>My Account</h2>
                <button class="close-btn" onclick="closeModal('profileModal')">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Profile Info Card -->
                <div style="background:var(--gray-50);padding:1.5rem;border-radius:var(--radius);margin-bottom:2rem;">
                    <h3 style="margin-bottom:1rem;font-size:1.2rem;color:var(--gray-800);">Profile Information</h3>
                    <form id="editProfileForm" onsubmit="updateProfile(event)">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="firstName">First Name</label>
                                <input type="text" class="form-control" id="firstName" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="lastName">Last Name</label>
                                <input type="text" class="form-control" id="lastName" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </div>

                <!-- My Books Section -->
                <div style="margin-bottom:2rem;">
                    <h3 style="margin-bottom:1rem;font-size:1.2rem;color:var(--gray-800);display:flex;align-items:center;gap:0.5rem;">
                        <span>📚</span> My Uploaded Books
                    </h3>
                    <div id="uploadedBooksGrid" style="display:grid;gap:1rem;">
                        <!-- Dynamically populated -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="modal" id="previewModal">
        <div class="modal-content" style="width:90%;max-width:1200px;height:90vh;display:flex;flex-direction:column;">
            <div class="modal-header">
                <h2>Book Preview</h2>
                <button class="close-btn" onclick="closeModal('previewModal')">&times;</button>
            </div>
            <div class="modal-body" style="padding:0;flex:1;overflow:hidden;">
                <iframe id="previewFrame" src="" style="width:100%;height:100%;border:none;"></iframe>
            </div>
        </div>
    </div>
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // API Base URL
        const API_BASE = '/api';

        // Current user (populated after auth check)
        let currentUser = null;

        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const isAuthenticated = await checkAuth();
            if (!isAuthenticated) {
                // Redirect to landing page if not logged in
                window.location.href = '/landing.html';
                return;
            }
            // Rest of your existing initialization code...
            await loadBooks();
            updateStats();
        });

        async function checkAuth() {
            try {
                const response = await fetch(`${API_BASE}/auth/me`, {
                    credentials: 'include'
                });
                if (response.ok) {
                    currentUser = await response.json();
                    return true;
                }
                return false;
            } catch (error) {
                return false;
            }
        }

        // Books array populated from API
        let books = [];

        // (Initialization moved to auth-check at top of script)

        // Load books function
        function renderBooks() {
            const grid = document.getElementById('booksGrid');
            if (!books || books.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1;">
                        <div class="empty-state">
                            <div class="empty-state-icon">📚</div>
                            <h3>No books found</h3>
                            <p>Start by adding your first book to the library</p>
                            <button class="btn btn-primary" onclick="showAddBookModal()">
                                + Add Your First Book
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = books.map(book => `
                <div class="book-card">
                    <div class="book-cover ${book.coverImage ? 'has-image' : ''}">
                        ${book.coverImage ? `<img src="${book.coverImage}" alt="${book.title}">` : ''}
                    </div>
                    <div class="book-content">
                        <h3 class="book-title">${book.title}</h3>
                        <div class="book-author">
                            <span>✍️</span>
                            ${book.author}
                        </div>
                        <div class="book-meta">
                            <span class="badge ${book.category === 'Programming' ? 'badge-primary' : ''}">${book.category || 'Uncategorized'}</span>
                            <span class="badge">📅 ${book.publicationYear || 'N/A'}</span>
                            <span class="badge ${book.available > 0 ? 'badge-success' : ''}">
                                ${book.available || 0}/${book.quantity || 1} available
                            </span>
                        </div>
                        <div class="book-footer">
                            <div class="file-info">
                                <span>📎</span>
                                <span>${book.fileName || 'No file'}</span>
                            </div>
                            <div>
                                <!-- preview action (opens modal) -->
                                <button class="icon-btn" onclick="previewBook('${book.id}')" title="Preview">
                                    <span>📄</span>
                                </button>
                                <!-- direct download action -->
                                <button class="icon-btn" onclick="downloadBook('${book.id}')" title="Download">
                                    <span>⬇️</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            updateStats();
        }

        async function loadBooks() {
            // retrieve books from backend depending on auth state
            try {
                const url = currentUser ? '/api/books/mybooks' : '/api/books';
                const resp = await fetch(url, { credentials: 'include' });
                if (resp.ok) {
                    books = await resp.json();
                } else {
                    books = [];
                }
            } catch (err) {
                console.error('Error fetching books:', err);
                books = [];
            }
            renderBooks();
            updateStats();
        }

        // Update statistics
        function updateStats() {
            document.getElementById('totalBooks').textContent = books.length;
            const available = books.reduce((sum, book) => sum + (book.available || 0), 0);
            document.getElementById('availableBooks').textContent = available;
        }

        // Search function
        async function searchBooks() {
            const term = document.getElementById('searchInput').value.trim();
            if (!term) {
                await loadBooks();
                return;
            }
            try {
                const resp = await fetch(`/api/books/search?term=${encodeURIComponent(term)}`, { credentials: 'include' });
                if (resp.ok) {
                    books = await resp.json();
                } else {
                    books = [];
                }
            } catch (err) {
                console.error('Error searching books:', err);
                books = [];
            }
            renderBooks();
            return;
        }

        // Reset search
        async function resetSearch() {
            document.getElementById('searchInput').value = '';
            await loadBooks();
        }

        // Debounced search
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(searchBooks, 300);
        });

        // Modal functions
        function showAddBookModal() {
            document.getElementById('addBookModal').classList.add('show');
        }

        function showLoginModal() {
            document.getElementById('loginModal').classList.add('show');
        }

        function showRegisterModal() {
            document.getElementById('registerModal').classList.add('show');
        }

        async function openProfileModal() {
            // ensure we have current user data
            if (!currentUser) {
                await checkAuthStatus();
            }
            document.getElementById('profileModal').classList.add('show');
            await loadProfileData();
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
            if (modalId === 'previewModal') {
                const iframe = document.getElementById('previewFrame');
                // revoke object URL to free memory
                if (iframe.src && iframe.src.startsWith('blob:')) {
                    URL.revokeObjectURL(iframe.src);
                }
                iframe.src = '';
            }
        }

        // Close modal when clicking outside
        window.onclick = (event) => {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('show');
            }
        }

        // Profile management helpers
        async function loadProfileData() {
            try {
                // fetch profile info
                const profileResp = await fetch('/api/user/profile', { credentials: 'include' });
                if (profileResp.ok) {
                    const profile = await profileResp.json();
                    currentUser = profile;
                    document.getElementById('firstName').value = profile.firstName || '';
                    document.getElementById('lastName').value = profile.lastName || '';
                }

                // uploaded books
                const uploadedResp = await fetch('/api/user/books', { credentials: 'include' });
                if (uploadedResp.ok) {
                    const books = await uploadedResp.json();
                    populateUploadedBooks(books);
                }
            } catch (err) {
                console.error('Error loading profile data:', err);
            }
        }

        function populateUploadedBooks(books) {
            const grid = document.getElementById('uploadedBooksGrid');
            grid.innerHTML = '';
            if (books && books.length) {
                books.forEach(b => {
                    const card = document.createElement('div');
                    card.style.cssText = 'background:white;padding:1rem;border-radius:var(--radius);border:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center;';
                    card.innerHTML = `
                        <div>
                            <div style="font-weight:600;color:var(--gray-800);margin-bottom:0.25rem;">${b.title}</div>
                            <div style="font-size:0.9rem;color:var(--gray-500);">by ${b.author}</div>
                            <div style="font-size:0.85rem;color:var(--gray-400);margin-top:0.25rem;">
                                <span class="badge">${b.category || 'Uncategorized'}</span>
                                <span class="badge">${b.available || 0}/${b.quantity || 1} available</span>
                            </div>
                        </div>
                        <div style="display:flex;gap:0.5rem;">
                            <button class="btn btn-outline" style="padding:0.5rem 1rem;" onclick="editBook('${b.id}')" title="Edit">
                                ✏️
                            </button>
                            <button class="btn btn-outline" style="padding:0.5rem 1rem;color:var(--danger);border-color:var(--danger);" onclick="deleteBook('${b.id}')" title="Delete">
                                🗑️
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } else {
                grid.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--gray-400);">You have not uploaded any books yet.</div>';
            }
        }

        function populateBorrowedBooks(books) {
            // Remove this function as it's no longer needed
        }

        async function deleteBook(id) {
            if (!confirm('Are you sure you want to delete this book?')) return;
            try {
                const resp = await fetch(`/api/books/${id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                if (resp.ok) {
                    showToast('Book deleted successfully', 'success');
                    await loadProfileData();
                    await loadBooks();
                } else {
                    const err = await resp.text();
                    showToast(err || 'Failed to delete book', 'error');
                }
            } catch (err) {
                console.error('Error deleting book:', err);
                showToast('Error deleting book', 'error');
            }
        }

        function editBook(id) {
            showToast('Edit feature coming soon', 'info');
        }

        async function updateProfile(event) {
            event.preventDefault();
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            try {
                const resp = await fetch('/api/user/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ firstName, lastName })
                });
                if (resp.ok) {
                    const updated = await resp.json();
                    currentUser = updated;
                    updateUIForAuthenticatedUser(updated);
                    showToast('Profile updated!', 'success');
                    closeModal('profileModal');
                } else {
                    const result = await resp.text();
                    showToast(result || 'Failed to update profile', 'error');
                }
            } catch (err) {
                console.error('Error updating profile:', err);
                showToast('An error occurred while updating profile', 'error');
            }
        }

        // Add book (persist via API)
        async function addBook(event) {
            event.preventDefault();
            if (!currentUser) {
                showToast('You must be logged in to add a book', 'error');
                return;
            }
            const form = document.getElementById('addBookForm');
            const fd = new FormData(form);
            // include quantity value explicitly
            fd.set('Quantity', document.getElementById('quantity').value);
            fd.set('Publisher', document.getElementById('publisher').value || '');
            const pc = document.getElementById('pageCount').value;
            if(pc) fd.set('PageCount', pc);

            try {
                const resp = await fetch('/api/books', {
                    method: 'POST',
                    credentials: 'include',
                    body: fd
                });
                if (resp.ok) {
                    const created = await resp.json();
                    showToast('Book added successfully!', 'success');
                    closeModal('addBookModal');
                    await loadBooks();
                    updateStats();
                    form.reset();
                } else {
                    const err = await resp.text();
                    showToast(err || 'Failed to add book', 'error');
                }
            } catch (error) {
                console.error('Error adding book:', error);
                showToast('An error occurred while adding book', 'error');
            }
        }

        // Login
        async function login(event) {
            event.preventDefault();

            const identifier = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ UsernameOrEmail: identifier, Password: password }),
                    credentials: 'include'
                });

                if (response.ok) {
                    const result = await response.json();
                    closeModal('loginModal');
                    showToast('Welcome back!', 'success');
                    if (result.user) {
                        currentUser = result.user;
                        updateUIForAuthenticatedUser(result.user);
                    }
                    // also refresh from server to ensure cookie-based session
                    await checkAuthStatus();
                } else {
                    const result = await response.json();
                    showToast(result.message || 'Login failed', 'error');
                }
            } catch (error) {
                console.error('Error during login:', error);
                showToast('An error occurred during login', 'error');
            }
        }

        // Register
        async function register(event) {
            event.preventDefault();
            const username = document.getElementById('regUsername').value;
            const firstName = document.getElementById('regFirstName').value;
            const lastName = document.getElementById('regLastName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirmPassword').value;

            if (password !== confirm) {
                showToast('Passwords do not match!', 'error');
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        Username: username,
                        Email: email,
                        Password: password,
                        ConfirmPassword: confirm,
                        FirstName: firstName,
                        LastName: lastName
                    }),
                    credentials: 'include'
                });

                if (response.ok) {
                    closeModal('registerModal');
                    showToast('Account created successfully!', 'success');
                    await checkAuthStatus();
                } else {
                    const result = await response.json();
                    showToast(result.message || 'Registration failed', 'error');
                }
            } catch (error) {
                console.error('Error during registration:', error);
                showToast('An error occurred during registration', 'error');
            }
        }

        // View book details (legacy helper)
        function viewBookDetails(id) {
            // treat same as preview for compatibility
            previewBook(id);
        }

        // Preview/download book
        async function previewBook(id) {
            try {
                // try to fetch the file as blob
                const fileResp = await fetch(`/api/books/${id}/preview`, { credentials: 'include' });
                if (!fileResp.ok) {
                    showToast('Could not load book file', 'error');
                    return;
                }
                const blob = await fileResp.blob();
                const url = URL.createObjectURL(blob);
                const iframe = document.getElementById('previewFrame');
                iframe.src = url;
                document.getElementById('previewModal').classList.add('show');
            } catch (err) {
                console.error('Error previewing book:', err);
                showToast('Error loading preview', 'error');
            }
        }

        // Direct download without showing modal
        async function downloadBook(id) {
            try {
                const resp = await fetch(`/api/books/${id}/download`, { credentials: 'include' });
                if (!resp.ok) {
                    showToast('Could not download file', 'error');
                    return;
                }
                const blob = await resp.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                // try to infer filename from content-disposition
                const cd = resp.headers.get('content-disposition');
                if (cd) {
                    const match = cd.match(/filename="?([^";]+)"?/);
                    if (match) a.download = match[1];
                }
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            } catch (err) {
                console.error('Error downloading book:', err);
                showToast('Error downloading file', 'error');
            }
        }

        // Update file name display
        function updateFileName(input) {
            const label = input.closest('.file-upload').querySelector('.file-upload-label span:last-child');
            if (input.files[0]) {
                label.textContent = input.files[0].name;
            }
        }

        // Toast notification
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span>${type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'}</span>
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Check authentication status
        document.addEventListener("DOMContentLoaded", () => {
            checkAuthStatus();
        });

        async function checkAuthStatus() {
            try {
                const response = await fetch("/api/auth/me", {
                    method: "GET",
                    credentials: "include"
                });

                if (response.ok) {
                    const user = await response.json();
                    currentUser = user;
                    updateUIForAuthenticatedUser(user);
                } else {
                    currentUser = null;
                    updateUIForGuest();
                }
            } catch (error) {
                console.error("Error checking authentication status:", error);
                currentUser = null;
                updateUIForGuest();
            }
            // reload books whenever auth status changes
            await loadBooks();
        }

        function updateUIForAuthenticatedUser(user) {
            const authSection = document.querySelector(".auth-section");
            authSection.innerHTML = "";

            const profileButton = document.createElement("button");
            profileButton.className = "btn btn-success";
            profileButton.textContent = user.username || "Profile";
            profileButton.onclick = openProfileModal;
            authSection.appendChild(profileButton);

            const signOutButton = document.createElement("button");
            signOutButton.className = "btn btn-outline";
            signOutButton.textContent = "Sign out";
            signOutButton.onclick = async () => {
                try {
                    await fetch("/api/auth/logout", {
                        method: "POST",
                        credentials: "include"
                    });
                    updateUIForGuest();
                    // redirect to login/landing page after logging out
                    window.location.href = '/landing.html';
                } catch (error) {
                    console.error("Error during logout:", error);
                }
            };
            authSection.appendChild(signOutButton);
        }

        function updateUIForGuest() {
            const authSection = document.querySelector(".auth-section");
            authSection.innerHTML = "";

            const loginButton = document.createElement("button");
            loginButton.className = "btn btn-outline";
            loginButton.textContent = "Sign in";
            loginButton.onclick = showLoginModal;
            authSection.appendChild(loginButton);

            const registerButton = document.createElement("button");
            registerButton.className = "btn btn-primary";
            registerButton.textContent = "Sign up";
            registerButton.onclick = showRegisterModal;
            authSection.appendChild(registerButton);
        }

        document.getElementById("signOutBtn").addEventListener("click", async () => {
            try {
                await fetch("/api/auth/logout", {
                    method: "POST",
                    credentials: "include"
                });
                updateUIForGuest();
                window.location.href = '/landing.html';
            } catch (error) {
                console.error("Error during logout:", error);
            }
        });
    </script>
</body>
</html>
